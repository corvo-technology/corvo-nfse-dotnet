name: Publish to NuGet

# Runs when a version tag is pushed (git tag v0.1.1 && git push origin v0.1.1).
# Uses NuGet trusted publishing: no API key is stored. One-time setup:
#   1. On nuget.org (Trusted Publishing), add a policy: owner = your nuget.org account, repository
#      corvo-technology/corvo-nfse-dotnet, workflow "publish.yml", environment "nuget",
#      scope "Push new packages and package versions", package "Corvo.Nfse".
#   2. Add the repository variable NUGET_USER with your nuget.org profile name (not your email).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: The tag must match the package version
        run: |
          VERSION=$(grep -m1 -oP '(?<=<Version>)[^<]+' src/Corvo.Nfse/Corvo.Nfse.csproj)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1; }

      - name: Test
        run: dotnet test

      - name: Pack
        run: dotnet pack src/Corvo.Nfse -c Release -o out

      - name: Exchange the GitHub token for a short-lived NuGet API key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish
        run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
