name: Publish to NuGet

# Runs when a version tag is pushed (git tag v0.1.1 && git push origin v0.1.1).
# Needs the repository secret NUGET_API_KEY (an API key from nuget.org).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: The tag must match the package version
        run: |
          VERSION=$(grep -m1 -oP '(?<=<Version>)[^<]+' src/Corvo.Nfse/Corvo.Nfse.csproj)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1; }

      - name: Test
        run: dotnet test

      - name: Pack
        run: dotnet pack src/Corvo.Nfse -c Release -o out

      - name: Publish
        run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
